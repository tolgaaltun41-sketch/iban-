<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banka Hesap Bilgileri</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;padding:24px}
.card{width:min(440px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 12px 40px rgba(0,0,0,.1);text-align:center}
h1{margin:0 0 24px;font-size:26px}.name{font-size:21px;font-weight:700;margin-bottom:20px}
.iban{font-size:20px;font-weight:600;letter-spacing:.5px;line-height:1.6;background:#f7f7f7;border-radius:14px;padding:18px 12px;word-break:break-word}
button{width:100%;margin-top:18px;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;background:#111;color:#fff}
#status{height:22px;margin-top:12px;font-size:14px;color:#555}
</style>
</head>
<body>
<div class="card">
<h1>Banka Hesap Bilgileri</h1>
<div class="name">Tolga Altun</div>
<div class="iban">TR11 0004 6006 3588 8000 1747 05</div>
<button onclick="copyIBAN()">IBAN'ı Kopyala</button>
<div id="status"></div>
</div>
<script>
async function copyIBAN(){
const iban="TR110004600635888000174705";
try{await navigator.clipboard.writeText(iban)}
catch(e){const ta=document.createElement("textarea");ta.value=iban;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}
document.getElementById("status").textContent="IBAN kopyalandı ✓";
}
</script>
</body>
</html>
