<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Banka Hesap Bilgileri</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f5f7fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 440px;
    background: white;
    border-radius: 22px;
    padding: 30px 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
}

h1 {
    margin: 0 0 28px;
    text-align: center;
    font-size: 25px;
    color: #111;
}

.label {
    font-size: 14px;
    color: #777;
    margin-bottom: 7px;
}

.name {
    font-size: 21px;
    font-weight: 600;
    color: #111;
    margin-bottom: 24px;
}

.iban {
    background: #f1f3f6;
    border-radius: 12px;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
    word-break: break-all;
    color: #111;
}

button {
    width: 100%;
    margin-top: 18px;
    padding: 16px;
    border: 0;
    border-radius: 12px;
    background: #29258f;
    color: white;
    font-size: 17px;
    font-weight: 600;
}

button:active {
    opacity: 0.8;
}

#status {
    text-align: center;
    margin-top: 12px;
    min-height: 20px;
    font-size: 14px;
    color: #29258f;
}
</style>
</head>

<body>

<div class="card">

    <h1>Banka Hesap Bilgileri</h1>

    <div class="label">Hesap Sahibi</div>
    <div class="name">Tolga Altun</div>

    <div class="label">IBAN</div>
    <div class="iban" id="iban">
        TR540013400002034955800001
    </div>

    <button onclick="copyIBAN()">
        IBAN'ı Kopyala
    </button>

    <div id="status"></div>

</div>

<script>
const iban = "TR540013400002034955800001";

async function copyIBAN() {

    try {
        await navigator.clipboard.writeText(iban);

        document.getElementById("status").textContent =
            "IBAN kopyalandı ✓";

    } catch (e) {

        const textarea = document.createElement("textarea");
        textarea.value = iban;

        document.body.appendChild(textarea);
        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        document.getElementById("status").textContent =
            "IBAN kopyalandı ✓";
    }
}
</script>

</body>
</html>
